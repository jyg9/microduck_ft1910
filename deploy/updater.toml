# /etc/robot/updater.toml — the config a client robot ships with.
#
# Installed by `scripts/install.sh`. This is the *production* file; keep
# `updater/updater.example.toml` as the annotated reference — it documents every option,
# including the ones deliberately not set here.
#
# The difference from the example is the point: the example shows what is possible, this
# shows what is true of a shipped robot. Every value below is either a decision or a
# fact, and where the two files disagree the example's comments explain the option while
# this file's comment explains the choice.

# The trust anchor. All three release public keys go in here at install time, even
# though only `release-1` signs today: a robot can verify only against the set baked
# into it, so shipping the spares is the one chance to make key rotation possible
# without physically re-flashing (docs/project/ci-setup.md).
trusted_keys_dir = "/etc/robot/trusted_keys"

# No `hw_rev`: the robot's hardware revision is the board /etc/robot/robotd.toml declares
# (`[board] version`), so a board is declared in one place. Robots installed before that
# carry `hw_rev = 1` here, which is the same answer for the board they are.

# Outside every `install_dir`, so the record of what happened survives the swap or
# rollback it is recording (§5.7).
state_dir = "/var/lib/robot/updater"

robot_socket = "/run/robotd.sock"

# Both false, and this is the file that makes them false on a client robot. `allow_dev_keys`
# would let anything a teammate builds install itself; `allow_fault_injection` would let the
# updater be told to fail on purpose. Developer boards override these locally — they are not
# overridden by an update, because updates do not touch /etc.
allow_dev_keys        = false
allow_fault_injection = false

# **No `check_interval`, and that is the decision this file is built around.**
#
# The periodic check is the one thing this robot does with nobody watching, and it is an
# outbound request to a host we do not run: the robot's own address ends up in somebody
# else's access log. Nothing is sent that names the robot — it is an unauthenticated `GET`
# — but the request itself is the disclosure, and a robot that never makes it cannot be
# enumerated by watching one.
#
# Omitting the key disables polling entirely, which also makes `min_supported` inert: a
# withdrawn release is noticed when somebody asks rather than on its own (§8.1). That is the
# trade this robot makes deliberately. `updater.example.toml` keeps a `check_interval` and
# explains what it buys; a fleet robot wants that, and this robot is not on the fleet.
#
# Pointing it at a host again is a config change rather than a rebuild — see the source block
# at the bottom of this file, which documents the two fields that do it.
# check_interval = "6h"

# `off`, and with no `check_interval` above it would be inert whatever it said. Written out
# rather than left to a default so that the two cannot be restored one at a time: a robot that
# re-added a timer without revisiting this line would start restarting itself.
#
# The other two values are for a robot that takes releases from a channel somebody operates.
# `mandatory` pulls itself forward when a release is withdrawn; `all` is the canary and bench
# setting (§16.2 Tier 2), which on a robot like this one takes the "when does my robot restart"
# decision away from its owner. Neither applies: there is no channel here to take releases from.
auto_apply = "off"

# Who may apply, roll back, select or pin. Read-only calls — status, log, listInstalled,
# check, subscribe — are never gated by this: reaching the socket already requires its group
# (mode 0660), and support must be able to inspect a robot it may not change.
#
# `btd` is listed because an owner updating the robot from their phone is what M6 exists to
# deliver, and without this `update.apply` over Bluetooth returns PERMISSION_DENIED. Note how
# narrow the claim is: "btd may relay an update request from the app", not "anything in the
# robot group may replace the firmware".
#
# `mediad` is listed for the mutating calls its route table permits: `account.login` and
# `account.logout` — a console page is where somebody signs a robot in — and `policy.install` and
# `policy.fetch`, which were routed to WebRTC without this line and therefore answered
# PERMISSION_DENIED, so the console could offer a Hub browser whose install button could not work. The claim is exactly as narrow, and it is held narrow by
# a test rather than by this comment: `mediad::route`'s
# `only_these_mutating_calls_are_reachable_over_webrtc` names every mutating method that
# transport may carry, so routing a new one has to change that list deliberately. Nothing here
# grants `mediad` the update path — `update.apply` is refused on that side.
#
# By NAME, not by uid: systemd-sysusers allocates dynamically, so a number written here would
# be right on one board and wrong on the next. `allow_uids`/`allow_gids` still exist for a
# bench override, and a test asserts the shipped config uses neither.
#
# What must never appear here is `allow_groups = ["robot"]`. Membership of `robot` is what gets
# a process as far as *talking* to updaterd; granting it change authority too would collapse
# the two layers into one, and anything that could read status could replace the firmware.
# There is a test for that as well.
allow_users = ["btd", "mediad"]


# ── daemon ────────────────────────────────────────────────────────────────────
[component.daemon]
install_dir   = "/opt/robot/daemon"
keep_previous = 1

# Include tools with no systemd unit, too: orphan checks cannot catch their absence.
# xtask's packaging tests keep this list aligned with every release recipe.
required_files = [
    "bin/updaterd", "bin/robotctl", "bin/robotd", "bin/configd", "bin/btd",
    "bin/padd", "bin/mediad", "bin/sounds", "bin/pet-detect", "bin/pet-features",
    "bin/tofd",
]

# `golden` is deliberately unset, and it must not be set to a guess.
#
# It names a never-pruned known-good release, and `robotctl update reset-to-golden` is the last
# link in the never-brick chain (§8.2). `updaterd` publishes the `golden` symlink on every start,
# but only for a version that is already installed — one this robot has never had is refused with
# "refusing to link missing release", and the guarantee is then void on a board that looks
# configured. That is why it is left out until there is something true to name.
#
# Arming it is one line naming **the version this board actually runs today**, read off the live
# release rather than chosen:
#
#     readlink /opt/robot/daemon/current     # releases/<version>
#     robotctl update status                 # the same version, by name
#
# Set it in the same change that installs that release.
# golden = "<the version `current` points at>"

# **A local directory: signed releases are dropped here and installed from here.** No host, no
# channel, nothing to poll. The point of the change is that a `github_releases` source here would
# be a standing egress to a public host on a robot that is not on the manufacturer's fleet.
#
# What this does *not* cost is any guarantee. An artifact found in this directory is verified
# exactly like a downloaded one — the same minisign check against the same trust anchor in
# `trusted_keys_dir`, the same hash check, the same preflight, the same health gate that makes
# rollback real, the same golden. Sideloading works because the signing key is trusted, not
# because a check is skipped (`source/local.rs`).
#
# Two ways releases arrive here:
#   * `updaterd install --from <dir>` / `robotctl update apply daemon --from <dir>`, which is what
#     `scripts/dev-push.sh` uses and which **overrides this key** for that one command. This is how
#     a development board is driven.
#   * dropping the files here by hand, and then `robotctl update apply daemon` with no `--from`.
#     This is the durable path, because a signed release left in a directory survives a reboot,
#     a rollback and somebody's shell history.
#
# The layout is a flat directory, per `source/local.rs`:
#
#     <version>.manifest.json
#     <version>.manifest.json.minisig
#     <the artifact the manifest's `url` names>
#     <that name>.minisig
#
# **It may be empty, and an empty one is not a fault.** A check against it fails with "no
# manifests in <dir>", which is the honest answer: there is nothing to install. Nothing polls, so
# that message is only ever said to somebody who asked for it.
#
# `/var/lib/robot/sideload` rather than somewhere under `/opt/robot/daemon`: that tree is what an
# apply prunes and swaps, and a drop directory inside it is a directory an update could delete.
# `/var/lib/robot` is the robot's state root, already created at provisioning, and already where
# the update journal and the sound bank live. It is outside `state_dir` above so that clearing the
# journal is not something anybody does to the pending release by accident.
[component.daemon.source]
type = "local_dir"
path = "/var/lib/robot/sideload"

# ── taking releases from a host again ────────────────────────────────────────────────────────
#
# Documented, not active: nothing in this block is read by anything until the two source blocks
# above and below are swapped. It is here because the whole point of `api_base`/`download_base` is
# that re-pointing a robot at a private host is config rather than a patch to this repository.
#
#   # api_base       where *this daemon* sends its requests. Defaults to the public GitHub API.
#   # download_base  the host a manifest's own `download/...` URLs name. Defaults to
#   #                `https://github.com`, and it must be the host the publishing CI actually used:
#   #                a private repository's `releases/download/...` URL 404s even with a token, so
#   #                those URLs are re-resolved through the API, and that recognition is matching a
#   #                manifest against this value. A manifest naming a host other than this one is
#   #                fetched verbatim rather than re-resolved, which is what keeps an unverified
#   #                manifest from aiming an authenticated request at a host it chose.
#   #
#   # Both are stripped of a trailing slash, so `https://github.com/` and `https://github.com` are
#   # the same base rather than a doubled slash that 404s.
#
# [component.daemon.source]
# type           = "github_releases"
# repo           = "your-org/duck-daemon"
# tag_prefix     = "daemon-v"
# manifest_asset = "manifest.json"
# api_base       = "https://api.github.com"
# download_base  = "https://github.com"
#
# A self-hosted GitHub moves both, and they are not always the same host — an API that lives under
# a path prefix is the normal Enterprise shape:
#
# api_base       = "https://github.example.com/api/v3"
# download_base  = "https://github.example.com"

# `updaterd` restarts neither itself nor `btd`, both of which ship in this same artifact:
# restarting itself would kill the executor mid-update, and restarting `btd` would drop
# the connection reporting progress to the app. Both pick up the new binary at the next
# boot. `mediad` needs no entry: the restart set is derived from the units the release ships,
# and `mediad.service` has an `[Install]` section, so an apply restarts it like the rest.
[component.daemon.on_apply]
action = "restart"
# The daemons whose binaries an update replaces and which are safe to interrupt while it runs.
# Without this an update swaps the binaries and the board keeps running the old ones until
# somebody reboots, which looks like an update that did nothing.
#
# TWO deliberate absences, both for the same reason — a service must not be restarted by the
# operation it is carrying:
#
#   updaterd, because it is the process performing the update (updater-design.md §4.1).
#   btd, because it may be the *transport* the update was requested over. Restarting it drops
#     the BLE connection carrying `update.subscribe`, so the phone that started the update loses
#     the progress stream and never learns the outcome. That is the whole app-driven flow, and
#     it is why `updater/src/config.rs` has a test refusing to let btd appear here.
#
# Neither waits for a reboot. Both are restarted 5s after the update replies, and the next updaterd
# start checks that happened and fixes what did not (docs/design/restart-order.md §1 and §5).
#
# configd *is* restarted: it holds no long-lived session state, the progress stream a client
# watches comes from updaterd rather than from it, and a config change that never takes effect
# until reboot would be its own kind of surprise.
#
# **The list is additive, not authoritative.** Since the restart set is derived from the units a
# release actually ships, this only needs to name units the release does *not* ship. Both entries
# below are therefore redundant, and kept because a config that names what it expects is easier to
# read than an empty list that quietly means "work it out".
#
# It used to be authoritative, and that is the bug this replaced: the file belongs to the operator
# and `install.sh` preserves it, so a board provisioned before `configd` existed kept
# `units = ["robotd"]` forever and every release swapped configd's binary while leaving the old
# process running. See `docs/project/install-path-gap.md` §4.
units  = ["robotd", "configd"]

# The gate that makes auto-rollback real. 30s is still the placeholder M4 is meant to
# replace with a measured boot time plus margin; too short reverts a healthy release that
# merely starts slowly.
#
# The gate rolls back on *unhealthy*, not on *degraded*. A robot that cannot see its servos
# reports degraded, and passes: it said the same thing before the swap, so reverting cannot
# fix it and would revert every release ever shipped to a bench board. A release that broke
# the control loop still reverts. `robotctl health` prints which one it is.
[component.daemon.health]
probe   = "socket"
timeout = "30s"


# ── models ────────────────────────────────────────────────────────────────────
# Absent on purpose, and this is not an oversight to be fixed by copying the example.
#
# `updater.example.toml` configures `model-walk` and `model-jump` against HF repos that
# do not exist yet. A component whose source cannot answer makes every `check` report a
# failure for a component nobody has shipped, which trains whoever reads robot status to
# ignore failures. Each model component lands in the change that first publishes its bundle.
#
# This robot's models arrive inside the daemon artifact or from the same sideload directory,
# so there is nothing here to point at an HF mirror either. If one is ever added, `endpoint`
# on an `hf_hub` source is the field that moves it off the public Hub.
